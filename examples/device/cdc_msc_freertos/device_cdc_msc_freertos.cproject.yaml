# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.6.0/tools/projmgr/schemas/cproject.schema.json
project:
  groups:
    - group: TinyUSB Example App (CDC-ACM + MSD) for FreeRTOS
      files:
        - file: ../../../tinyusb/examples/device/cdc_msc_freertos/src/main.c
        - file: ../../../tinyusb/examples/device/cdc_msc_freertos/src/usb_descriptors.c
        - file: ../../../tinyusb/examples/device/cdc_msc_freertos/src/msc_disk.c
        - file: ../../../tinyusb/examples/device/cdc_msc_freertos/src/freertos_hook.c

  layers:
    - layer: ../../../tinyusb_alif/tinyusb_alif.clayer.yaml


  add-path:
    - ../../../tinyusb/examples/device/cdc_msc_freertos/src/

  components:
    - component: AlifSemiconductor::Device:Startup&C Startup
    - component: ARM::CMSIS:CORE

  output:
    base-name: $Project$
    type:
      - elf
      - bin
