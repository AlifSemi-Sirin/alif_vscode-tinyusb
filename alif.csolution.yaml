# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.6.0/tools/projmgr/schemas/csolution.schema.json
solution:
  created-for: cmsis-toolbox@2.6.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: GCC

  # Select used compiler
  compiler: GCC

  packs:
    - pack: AlifSemiconductor::Ensemble@1.3.0
    - pack: ARM::CMSIS@6.0.0

  target-types:
    - type: HE
      device: Alif Semiconductor::AE722F80F55D5LS:M55_HE
      define:
        - "CORE_M55_HE"
    - type: HP
      device: Alif Semiconductor::AE722F80F55D5LS:M55_HP
      define:
        - "CORE_M55_HP"

  build-types:
    - type: debug
      optimize: none
      debug: on
      define:
        - _DEBUG
    - type: release
      optimize: speed
      debug: on
      define:
        - _RELEASE

  define:
    - UNICODE
    - _UNICODE
    - BOARD_TUD_MAX_SPEED: OPT_MODE_HIGH_SPEED
    - SECTION_USB_DMA_BUF: \"usb_dma_buf\"
    - CFG_TUSB_MEM_SECTION: __attribute__\(\(section\(SECTION_USB_DMA_BUF\)\)\)
    - CFG_TUSB_MEM_ALIGN: __attribute__\(\(aligned\(32\)\)\)

  projects:
    - project: examples/device/cdc_msc/tinyusb.cproject.yaml
